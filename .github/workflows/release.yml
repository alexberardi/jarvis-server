name: release

# Builds the one-file jarvisd download for every target and publishes it as a GitHub release.
# A tag v* publishes; a manual run builds and checks only unless publish is set (a dry run).
#
# Each archive holds the single jarvisd binary (sherpa-onnx libraries embedded, CGO_ENABLED=0)
# plus LICENSE and NOTICE. GPU engines (llama-server, whisper-server) are not bundled: the
# model manager fetches the pinned build for the machine on first use.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp (e.g. v0.1.0-rc1)
        required: true
      publish:
        description: Publish a GitHub release (off = build and check only)
        type: boolean
        default: false

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then v="${GITHUB_REF_NAME}"; else v="${{ inputs.version }}"; fi
          case "$v" in v[0-9]*) ;; *) echo "version must look like v1.2.3, got '$v'"; exit 1;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Fetch native libs (all targets)
        run: scripts/fetch-sherpa-libs.sh linux-amd64 linux-arm64 darwin-arm64 windows-amd64
      # The admin SPA is static files, built once and embedded in every target.
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/admin/.nvmrc
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - name: Build the admin UI
        run: |
          npm --prefix web/admin ci
          npm --prefix web/admin run build
      - name: Check the admin UI is embedded (not the placeholder)
        run: go test ./web/admin -run TestEmbeddedUI -tags release_ui -count=1 -v
      - name: Build and package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for p in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os=${p%/*}; arch=${p#*/}; name="jarvisd-${VERSION}-${os}-${arch}"
            exe=jarvisd; [ "$os" = windows ] && exe=jarvisd.exe
            mkdir -p "stage/$name"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "stage/$name/$exe" ./cmd/jarvisd
            cp LICENSE "stage/$name/"
            [ -f NOTICE ] && cp NOTICE "stage/$name/"
            if [ "$os" = windows ]; then
              (cd stage && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C stage -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist && cat dist/SHA256SUMS
      # SHA256SUMS.minisig is the self-update trust root (AD5, ID9): jarvisd verifies it with
      # the project key built into the running binary before it installs anything. Signed with
      # the same minisign key as the node and admin releases (repo secrets MINISIGN_SECRET_KEY,
      # the whole .key file, and MINISIGN_PASSWORD). The trusted comment names the version, so
      # a signed list can't be replayed under another tag. Without the secret a dry run warns
      # and ships unsigned; a publishing run fails (jarvisd refuses unsigned releases).
      - name: Sign SHA256SUMS (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          VERSION: ${{ steps.v.outputs.version }}
          PUBLISHING: ${{ github.event_name == 'push' || inputs.publish }}
          PROJECT_KEY: RWRyW6ICtU+iyX4p4RnS24ju0gRsWpxvv6B8pI9G+ZS01q8t8oupAQ8L
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            if [ "$PUBLISHING" = true ]; then
              echo "::error::MINISIGN_SECRET_KEY is not set: refusing to publish an unsigned release (jarvisd upgrade and the admin Update button would refuse it)"
              exit 1
            fi
            echo "::warning::MINISIGN_SECRET_KEY is not set: this dry run is UNSIGNED (no SHA256SUMS.minisig)"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          # minisign reads the password from stdin when it isn't a terminal.
          printf '%s\n' "${MINISIGN_PASSWORD:-}" | minisign -S -s "$key" -m dist/SHA256SUMS -t "jarvisd ${VERSION} SHA256SUMS"
          shred -u "$key" 2>/dev/null || rm -f "$key"
          # The secret must be the project key the binaries trust.
          minisign -V -P "$PROJECT_KEY" -m dist/SHA256SUMS
          cat dist/SHA256SUMS.minisig
      - name: Smoke-test the linux/amd64 build
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          bin="stage/jarvisd-${VERSION}-linux-amd64/jarvisd"
          test "$("$bin" version)" = "$VERSION"
          export JARVIS_HOME="$RUNNER_TEMP/jarvis"
          "$bin" migrate status
      # The one-line installers ship as release assets (the admin's update check shows an
      # install command only when they are there). They are fetched on their own over TLS, so
      # they stay out of SHA256SUMS.
      - name: Add the install scripts
        run: cp scripts/install.sh scripts/install.ps1 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: jarvisd-${{ steps.v.outputs.version }}
          path: dist/
          if-no-files-found: error

  # Each OS proves its own binary starts and its embedded voice libraries load.
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-amd64, ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: linux-arm64, ext: tar.gz }
          - { os: macos-14, target: darwin-arm64, ext: tar.gz }
          - { os: windows-latest, target: windows-amd64, ext: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvisd-${{ needs.build.outputs.version }}
          path: dist
      - name: Unpack and start
        env:
          NAME: jarvisd-${{ needs.build.outputs.version }}-${{ matrix.target }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          if [ "${{ matrix.ext }}" = zip ]; then unzip -q "$NAME.zip"; exe=jarvisd.exe; else tar -xzf "$NAME.tar.gz"; exe=jarvisd; fi
          bin="$PWD/$NAME/$exe"
          test "$("$bin" version | tr -d '\r')" = "$VERSION"
          export JARVIS_HOME="$RUNNER_TEMP/jarvis"
          "$bin" migrate status
      # The binary's own verifier (the one self-update uses) accepts the CI-made signature.
      - name: Check the signature with jarvisd
        env:
          NAME: jarvisd-${{ needs.build.outputs.version }}-${{ matrix.target }}
        run: |
          set -euo pipefail
          cd dist
          exe=jarvisd; [ "${{ matrix.ext }}" = zip ] && exe=jarvisd.exe
          if [ -f SHA256SUMS.minisig ]; then
            JARVIS_HOME="$RUNNER_TEMP/jarvis" "$PWD/$NAME/$exe" upgrade --verify-dir "$PWD"
          else
            echo "::warning::no SHA256SUMS.minisig (unsigned dry run); signature not checked"
          fi

  publish:
    needs: [build, verify]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvisd-${{ needs.build.outputs.version }}
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          pre=""; case "$VERSION" in *-*) pre="--prerelease";; esac
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --title "jarvisd $VERSION" \
            --notes "Single-binary Jarvis server. Download the archive for your platform, verify it against SHA256SUMS (signed: SHA256SUMS.minisig, minisign key RWRyW6ICtU+iyX4p4RnS24ju0gRsWpxvv6B8pI9G+ZS01q8t8oupAQ8L), and run \`jarvisd serve\`. Existing installs: \`jarvisd upgrade\`. Run \`jarvisd doctor\` to check that nodes and phones can reach it." \
            $pre

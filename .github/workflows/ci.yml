name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.25"

jobs:
  # Unit tests + vet + CGO_ENABLED=0 cross-compile for every release target.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fetch native libs (all targets)
        run: scripts/fetch-sherpa-libs.sh linux-amd64 linux-arm64 darwin-arm64 windows-amd64
      - name: Vet + cross-compile
        run: |
          for p in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go vet ./...
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null ./...
          done
      # -race needs cgo; this is test-only, release builds stay CGO_ENABLED=0.
      - name: Unit tests (race)
        run: CGO_ENABLED=1 go test -race ./...

  # The admin SPA (web/admin). The Go jobs don't need it: without a build they embed the
  # placeholder page. The bundle is platform-independent, so it is built once here.
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/admin/.nvmrc
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-ui
          path: web/admin/dist/ui
          if-no-files-found: error

  # Load the embedded native libraries via purego and run real models on each OS.
  native-voice:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-14,         target: darwin-arm64 }
          - { os: windows-latest,   target: windows-amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fetch native libs
        run: scripts/fetch-sherpa-libs.sh ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: .models
          key: voice-models-${{ hashFiles('scripts/fetch-test-models.sh') }}
      - name: Fetch test models
        run: scripts/fetch-test-models.sh
      - name: Voice tests (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          JARVIS_SHERPA_MODELS: ${{ github.workspace }}/.models
        run: go test ./internal/voice/... -v -run 'Layout|Extract|Smoke|Kokoro'
      # The platform layer touches OS specifics (process groups, file renames, sockets), so
      # its tests run on every OS too, not just linux.
      - name: Platform tests (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go test ./cmd/... ./internal/platform/... ./internal/audio/... ./internal/update/...

  # I1: register jarvisd with each OS's service manager the way the installers will, check it
  # serves /health under that supervisor and comes back after being killed, then uninstall.
  # Runners have passwordless sudo / admin. (`! cmd` doesn't trip `bash -e`, hence the ifs.)
  service:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-amd64 }
          - { os: macos-14,       target: darwin-arm64 }
          - { os: windows-latest, target: windows-amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fetch native libs
        run: scripts/fetch-sherpa-libs.sh ${{ matrix.target }}
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o dist/ ./cmd/jarvisd

      - name: Linux system unit
        if: runner.os == 'Linux'
        run: |
          set -x
          sudo install -m 755 dist/jarvisd /usr/local/bin/jarvisd
          sudo jarvisd service install
          # As a plain user: the 0640 env file is unreadable, so the default ports apply.
          jarvisd service status --wait 90s
          curl -fsS http://127.0.0.1:7700/health
          pid=$(systemctl show -p MainPID --value jarvisd)
          test "$(ps -o user= -p "$pid")" = jarvisd
          test "$(systemctl show -p Type --value jarvisd)" = notify
          test "$(sudo stat -c %a /var/lib/jarvisd)" = 700
          test "$(sudo stat -c %a /var/lib/jarvisd/jarvis.db)" = 600
          test "$(sudo stat -c %U:%G:%a /etc/jarvisd/jarvisd.env)" = root:jarvisd:640
          # The supervisor brings a killed jarvisd back.
          sudo kill -9 "$pid"
          sleep 2
          sudo jarvisd service status --wait 90s
          test "$(systemctl show -p MainPID --value jarvisd)" != "$pid"
          sudo jarvisd service restart
          sudo jarvisd service status --wait 90s
          sudo jarvisd service uninstall
          test ! -e /etc/systemd/system/jarvisd.service
          if systemctl is-active --quiet jarvisd; then exit 1; fi
          if curl -fsS http://127.0.0.1:7700/health; then exit 1; fi
          sudo test -d /var/lib/jarvisd          # data kept
      - name: Linux journal
        if: failure() && runner.os == 'Linux'
        run: sudo journalctl -u jarvisd --no-pager | tail -200

      - name: macOS LaunchDaemon
        if: runner.os == 'macOS'
        run: |
          set -x
          sudo mkdir -p /usr/local/bin
          sudo install -m 755 dist/jarvisd /usr/local/bin/jarvisd
          sudo jarvisd service install           # runs as $SUDO_USER, data in ~/.jarvisd
          jarvisd service status --wait 90s
          curl -fsS http://127.0.0.1:7700/health
          pid=$(pgrep -x jarvisd)
          test "$(ps -o user= -p "$pid" | tr -d ' ')" = "$(id -un)"
          test "$(stat -f %Lp ~/.jarvisd)" = 700
          test "$(stat -f %Lp ~/.jarvisd/jarvis.db)" = 600
          test -s ~/.jarvisd/logs/jarvisd.log
          sudo kill -9 "$pid"
          sleep 2
          jarvisd service status --wait 90s
          test "$(pgrep -x jarvisd)" != "$pid"
          sudo jarvisd service restart
          jarvisd service status --wait 90s
          sudo jarvisd service uninstall
          test ! -e /Library/LaunchDaemons/net.jarvisautomation.jarvisd.plist
          sleep 2
          if curl -fsS http://127.0.0.1:7700/health; then exit 1; fi
          test -d ~/.jarvisd                     # data kept
      - name: macOS log
        if: failure() && runner.os == 'macOS'
        run: tail -200 ~/.jarvisd/logs/jarvisd.log || true

      - name: Windows service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = Join-Path $env:ProgramFiles 'jarvisd'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist\jarvisd.exe $dir
          $exe = Join-Path $dir 'jarvisd.exe'
          & $exe service install
          & $exe service status --wait 120s
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7700/health | Select-Object -ExpandProperty Content
          $svc = Get-CimInstance Win32_Service -Filter "Name='jarvisd'"
          if ($svc.StartName -ne 'NT SERVICE\jarvisd') { throw "account: $($svc.StartName)" }
          if (-not $svc.DelayedAutoStart) { throw 'not delayed auto start' }
          if ($svc.PathName -notmatch '--home') { throw "no --home: $($svc.PathName)" }
          sc.exe qsidtype jarvisd
          sc.exe qfailure jarvisd
          sc.exe qfailureflag jarvisd
          icacls C:\ProgramData\jarvisd
          $p = Get-Process -Id $svc.ProcessId -IncludeUserName
          if ($p.UserName -ne 'NT SERVICE\jarvisd') { throw "runs as $($p.UserName)" }
          if (-not (Test-Path C:\ProgramData\jarvisd\jarvis.db)) { throw 'no DB under ProgramData' }
          if ((Get-Item C:\ProgramData\jarvisd\logs\jarvisd.log).Length -eq 0) { throw 'empty service log' }
          # A crash is restarted by the recovery actions (first after 5 s).
          Stop-Process -Id $svc.ProcessId -Force
          Start-Sleep 2
          & $exe service status --wait 90s
          $new = (Get-CimInstance Win32_Service -Filter "Name='jarvisd'").ProcessId
          if ($new -eq $svc.ProcessId) { throw 'not restarted' }
          # A clean stop ends the process (the SCM Stop cancels serve's context).
          & $exe service stop
          if (Get-Process -Id $new -ErrorAction SilentlyContinue) { throw 'still running after stop' }
          & $exe service restart
          & $exe service status --wait 120s
          & $exe service uninstall
          if (Get-Service jarvisd -ErrorAction SilentlyContinue) { throw 'service still registered' }
          if (-not (Test-Path C:\ProgramData\jarvisd\jarvis.db)) { throw 'data not kept' }
      - name: Windows log
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: Get-Content C:\ProgramData\jarvisd\logs\jarvisd.log -Tail 200

  # AD5/ID10: self-update end to end under the systemd system unit, from fake signed releases
  # (a throwaway minisign key trusted by test builds only): CLI upgrade, a broken release that
  # rolls back, the admin Update button through the unit's privileged ExecStartPre helper, the
  # restart button, and a manual rollback. See scripts/upgrade-e2e.sh.
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fetch native libs
        run: scripts/fetch-sherpa-libs.sh linux-amd64
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: Upgrade end to end (system unit)
        run: scripts/upgrade-e2e.sh system
      - name: Journal
        if: failure()
        run: sudo journalctl -u jarvisd --no-pager | tail -300

  # The install scripts (I3, I4) end to end against a release-shaped archive of this commit,
  # served from a local HTTP server (--base-url): verify, install, firewall fix, health,
  # idempotent re-run, uninstall (data kept), reinstall, uninstall --purge.
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-amd64,   ext: tar.gz }
          - { os: macos-14,       target: darwin-arm64,  ext: tar.gz }
          - { os: windows-latest, target: windows-amd64, ext: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      V: v0.0.0-ci
      V2: v0.0.1-ci
      V3: v0.0.2-ci
      BASE: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fetch native libs
        run: scripts/fetch-sherpa-libs.sh ${{ matrix.target }}
      # Two releases signed with a throwaway key that the test builds trust (-X …extraTrustedKey,
      # never in a real release): $V in dist/, $V2 in dist/next/ for the re-run that hands over
      # to `jarvisd upgrade`, and an unsigned $V3 in dist/unsigned/ that jarvisd must refuse.
      # The key is made and used by scripts/testsign, so no minisign lands on PATH (the scripts
      # require the project's signature when it is there).
      - name: Build release-shaped archives
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/test.key"
          pub=$(go run ./scripts/testsign keygen "$key")
          exe=jarvisd; [ "$RUNNER_OS" = Windows ] && exe=jarvisd.exe
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          release() { # tag dir
            local name="jarvisd-$1-${{ matrix.target }}"
            mkdir -p "stage/$name" "$2"
            go build -trimpath -o "stage/$name/$exe" \
              -ldflags "-X main.version=$1 -X github.com/alexberardi/jarvis-server/internal/update.extraTrustedKey=$pub" ./cmd/jarvisd
            if [ "${{ matrix.ext }}" = zip ]; then (cd stage && 7z a -tzip -bd "../$2/$name.zip" "$name" >/dev/null)
            else tar -C stage -czf "$2/$name.tar.gz" "$name"; fi
            (cd "$2" && sum "$name.${{ matrix.ext }}" > SHA256SUMS)
            go run ./scripts/testsign sign "$key" "$2/SHA256SUMS" "jarvisd $1 SHA256SUMS"
            cat "$2/SHA256SUMS"
          }
          release "$V" dist
          release "$V2" dist/next
          mkdir -p dist/unsigned
          echo "$(printf '0%.0s' $(seq 64))  jarvisd-$V3-${{ matrix.target }}.${{ matrix.ext }}" > dist/unsigned/SHA256SUMS
          cp scripts/install.sh scripts/install.ps1 dist/

      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh scripts/install.sh

      - name: Linux install.sh
        if: runner.os == 'Linux'
        run: |
          set -x
          (cd dist && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          # ufw on (default deny incoming) so the firewall fix has something to do.
          sudo ufw --force enable
          # A legacy container holding 7700: refused without --stop-legacy, stopped with it.
          docker run -d --name jarvis-config-service --restart unless-stopped -p 7700:80 nginx:alpine
          if sh scripts/install.sh --base-url "$BASE" --yes; then exit 1; fi
          sh scripts/install.sh --base-url "$BASE" --yes --stop-legacy
          test "$(docker inspect -f '{{.State.Running}} {{.HostConfig.RestartPolicy.Name}}' jarvis-config-service)" = "false no"
          test "$(jarvisd version)" = "$V"
          curl -fsS http://127.0.0.1:7700/health
          curl -fsSI http://127.0.0.1:7700/health | grep -i '^server: jarvisd'
          sudo ufw status | grep -q '# jarvisd'
          sudo jarvisd doctor
          sudo jarvisd setup-link | grep -q '/setup#token='
          # Re-running the same version is a no-op.
          sh scripts/install.sh --base-url "$BASE" --yes | tee rerun.log
          grep -q 'already installed' rerun.log
          # Uninstall: service, binary and firewall rules go; data and account stay.
          sh scripts/install.sh --uninstall
          test ! -e /usr/local/bin/jarvisd && test ! -e /etc/systemd/system/jarvisd.service
          if sudo ufw status | grep -q jarvisd; then exit 1; fi
          sudo test -f /var/lib/jarvisd/jarvis.db && id jarvisd
          # Reinstall over the kept data.
          sh scripts/install.sh --base-url "$BASE" --yes
          # A re-run with a newer release hands over to `jarvisd upgrade` (system unit, run as
          # root through sudo): signature checked by the installed binary, snapshot, swap,
          # restart, health gate.
          sh scripts/install.sh --base-url "$BASE/next" --yes | tee up.log
          grep -q 'with `jarvisd upgrade`' up.log
          grep -q "jarvisd $V2 is up and healthy" up.log
          test "$(jarvisd version)" = "$V2"
          curl -fsS http://127.0.0.1:7710/health | python3 -c 'import json,sys,os; assert json.load(sys.stdin)["version"] == os.environ["V2"]'
          test "$(/usr/local/bin/jarvisd.prev version)" = "$V"
          sudo cat /var/lib/jarvisd/updates/last-upgrade.json | python3 -c 'import json,sys; assert json.load(sys.stdin)["outcome"] == "succeeded"'
          sudo sh -c 'ls /var/lib/jarvisd/backups/jarvis-v0.0.0_ci-*.db' # the version, file-name safe
          sh scripts/install.sh --base-url "$BASE/next" --yes | grep -q 'already installed'
          # An unsigned release: jarvisd refuses it, nothing changes.
          if sh scripts/install.sh --base-url "$BASE/unsigned" --yes 2>&1 | tee bad.log; then :; fi
          grep -q 'only installs signed releases' bad.log
          test "$(jarvisd version)" = "$V2"
          curl -fsS http://127.0.0.1:7710/health
          # Purge everything (jarvisd.prev included).
          sh scripts/install.sh --uninstall --purge --yes
          test ! -e /usr/local/bin/jarvisd.prev
          sudo test ! -e /var/lib/jarvisd && sudo test ! -e /etc/jarvisd
          if id jarvisd; then exit 1; fi
          sudo ufw --force disable
          # With minisign installed a fresh install requires the project's signature: this
          # release is signed by the throwaway key, so the script refuses it.
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          if sh scripts/install.sh --base-url "$BASE" --yes 2>&1 | tee sig.log; then :; fi
          grep -q 'signature is INVALID' sig.log
          test ! -e /usr/local/bin/jarvisd
      - name: Linux journal
        if: failure() && runner.os == 'Linux'
        run: sudo journalctl -u jarvisd --no-pager | tail -200

      - name: macOS install.sh
        if: runner.os == 'macOS'
        run: |
          set -x
          fw=/usr/libexec/ApplicationFirewall/socketfilterfw
          (cd dist && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          sudo $fw --setglobalstate on
          sh scripts/install.sh --base-url "$BASE" --yes
          test "$(jarvisd version)" = "$V"
          curl -fsS http://127.0.0.1:7700/health
          $fw --getappblocked /usr/local/bin/jarvisd | grep -q permitted
          # macOS may admit a new program by itself; take it out so doctor --fix has work.
          sudo $fw --remove /usr/local/bin/jarvisd
          if sudo jarvisd doctor; then exit 1; fi
          sudo jarvisd doctor --fix
          $fw --getappblocked /usr/local/bin/jarvisd | grep -q permitted
          test "$(stat -f %Lp ~/.jarvisd)" = 700
          sudo jarvisd setup-link | grep -q '/setup#token='
          sh scripts/install.sh --base-url "$BASE" --yes | tee rerun.log
          grep -q 'already installed' rerun.log
          sh scripts/install.sh --uninstall
          test ! -e /usr/local/bin/jarvisd && test ! -e /Library/LaunchDaemons/net.jarvisautomation.jarvisd.plist
          if $fw --listapps | grep -q /usr/local/bin/jarvisd; then exit 1; fi
          test -f ~/.jarvisd/jarvis.db
          sh scripts/install.sh --base-url "$BASE" --yes
          $fw --getappblocked /usr/local/bin/jarvisd | grep -q permitted
          # A re-run with a newer release hands over to `sudo jarvisd upgrade`; the new build has
          # another ad-hoc signature, and the upgrade re-admits it to the firewall.
          sh scripts/install.sh --base-url "$BASE/next" --yes | tee up.log
          grep -q "jarvisd $V2 is up and healthy" up.log
          test "$(jarvisd version)" = "$V2"
          test "$(/usr/local/bin/jarvisd.prev version)" = "$V"
          curl -fsS http://127.0.0.1:7710/health | python3 -c 'import json,sys,os; assert json.load(sys.stdin)["version"] == os.environ["V2"]'
          python3 -c 'import json,os; assert json.load(open(os.path.expanduser("~/.jarvisd/updates/last-upgrade.json")))["outcome"] == "succeeded"'
          $fw --getappblocked /usr/local/bin/jarvisd | grep -q permitted
          sudo jarvisd doctor
          # The unsigned release is refused.
          if sh scripts/install.sh --base-url "$BASE/unsigned" --yes 2>&1 | tee bad.log; then :; fi
          grep -q 'only installs signed releases' bad.log
          test "$(jarvisd version)" = "$V2"
          sh scripts/install.sh --uninstall --purge --yes
          test ! -e ~/.jarvisd && test ! -e /usr/local/bin/jarvisd.prev
          sudo $fw --setglobalstate off
      - name: macOS log
        if: failure() && runner.os == 'macOS'
        run: tail -200 ~/.jarvisd/logs/jarvisd.log || true

      # Windows PowerShell 5.1 (powershell.exe, not pwsh), as `irm | iex` runs it.
      - name: Windows install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable.PSVersion
          Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'dist' -WindowStyle Hidden
          Start-Sleep 2
          netsh advfirewall set allprofiles state on
          function Install([string[]]$more) {
            & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -BaseUrl $env:BASE @more
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 $more failed ($LASTEXITCODE)" }
          }
          $exe = Join-Path $env:ProgramFiles 'jarvisd\jarvisd.exe'
          Install @('-Yes')
          if ((& $exe version) -ne $env:V) { throw 'wrong version' }
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7700/health | Select-Object -ExpandProperty Content
          netsh advfirewall firewall show rule name=jarvisd verbose
          if ($LASTEXITCODE -ne 0) { throw 'no jarvisd firewall rule' }
          if ([Environment]::GetEnvironmentVariable('Path', 'Machine') -notmatch [regex]::Escape((Split-Path $exe))) { throw 'not on the machine PATH' }
          if (-not ((& $exe setup-link) -match '/setup#token=')) { throw 'no setup link' }
          $rerun = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -BaseUrl $env:BASE -Yes | Out-String
          if ($rerun -notmatch 'already installed') { throw "re-run was not a no-op: $rerun" }
          Install @('-Uninstall')
          if (Get-Service jarvisd -ErrorAction SilentlyContinue) { throw 'service still registered' }
          if (Test-Path $exe) { throw 'binary not removed' }
          netsh advfirewall firewall show rule name=jarvisd | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'firewall rule not removed' }
          if (-not (Test-Path C:\ProgramData\jarvisd\jarvis.db)) { throw 'data not kept' }
          Install @('-Yes')
          # A re-run with a newer release hands over to `jarvisd upgrade` (SCM restart, health gate).
          $up = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -BaseUrl "$env:BASE/next" -Yes | Out-String
          if ($LASTEXITCODE -ne 0) { throw "upgrade re-run failed: $up" }
          Write-Host $up
          if ($up -notmatch "jarvisd $env:V2 is up and healthy") { throw 'no healthy upgrade reported' }
          if ((& $exe version) -ne $env:V2) { throw 'not upgraded' }
          if ((& (Join-Path $env:ProgramFiles 'jarvisd\jarvisd.prev.exe') version) -ne $env:V) { throw 'jarvisd.prev.exe is not the old version' }
          $h = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7710/health | Select-Object -ExpandProperty Content | ConvertFrom-Json
          if ($h.version -ne $env:V2) { throw "running $($h.version)" }
          $last = Get-Content C:\ProgramData\jarvisd\updates\last-upgrade.json -Raw | ConvertFrom-Json
          if ($last.outcome -ne 'succeeded') { throw "outcome $($last.outcome)" }
          # The unsigned release is refused.
          $ErrorActionPreference = 'Continue' # 5.1 turns redirected native stderr into errors
          $bad = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -BaseUrl "$env:BASE/unsigned" -Yes 2>&1 | Out-String
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -eq 0 -or $bad -notmatch 'only installs signed releases') { throw "unsigned release not refused: $bad" }
          if ((& $exe version) -ne $env:V2) { throw 'the refused upgrade changed the binary' }
          Install @('-Uninstall', '-Purge', '-Yes')
          if (Test-Path C:\ProgramData\jarvisd) { throw 'data not purged' }
          $global:LASTEXITCODE = 0
      - name: Windows log
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: Get-Content C:\ProgramData\jarvisd\logs\jarvisd.log -Tail 200

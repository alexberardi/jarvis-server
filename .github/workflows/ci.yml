name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.27"

jobs:
  # Unit tests + vet + CGO_ENABLED=0 cross-compile for every release target.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fetch native libs (all targets)
        run: scripts/fetch-sherpa-libs.sh linux-amd64 linux-arm64 darwin-arm64 windows-amd64
      - name: Vet + cross-compile
        run: |
          for p in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go vet ./...
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null ./...
          done
      # -race needs cgo; this is test-only, release builds stay CGO_ENABLED=0.
      - name: Unit tests (race)
        run: CGO_ENABLED=1 go test -race ./...

  # The admin SPA (web/admin). The Go jobs don't need it: without a build they embed the
  # placeholder page. The bundle is platform-independent, so it is built once here.
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/admin/.nvmrc
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-ui
          path: web/admin/dist/ui
          if-no-files-found: error

  # Load the embedded native libraries via purego and run real models on each OS.
  native-voice:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-14,         target: darwin-arm64 }
          - { os: windows-latest,   target: windows-amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fetch native libs
        run: scripts/fetch-sherpa-libs.sh ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: .models
          key: voice-models-${{ hashFiles('scripts/fetch-test-models.sh') }}
      - name: Fetch test models
        run: scripts/fetch-test-models.sh
      - name: Voice tests (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          JARVIS_SHERPA_MODELS: ${{ github.workspace }}/.models
        run: go test ./internal/voice/... -v -run 'Layout|Extract|Smoke|Kokoro'
      # The platform layer touches OS specifics (process groups, file renames, sockets), so
      # its tests run on every OS too, not just linux.
      - name: Platform tests (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go test ./cmd/... ./internal/platform/... ./internal/audio/... ./internal/update/...

  # I1: register jarvisd with each OS's service manager the way the installers will, check it
  # serves /health under that supervisor and comes back after being killed, then uninstall.
  # Runners have passwordless sudo / admin. (`! cmd` doesn't trip `bash -e`, hence the ifs.)
  service:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-amd64 }
          - { os: macos-14,       target: darwin-arm64 }
          - { os: windows-latest, target: windows-amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fetch native libs
        run: scripts/fetch-sherpa-libs.sh ${{ matrix.target }}
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o dist/ ./cmd/jarvisd

      - name: Linux system unit
        if: runner.os == 'Linux'
        run: |
          set -x
          sudo install -m 755 dist/jarvisd /usr/local/bin/jarvisd
          sudo jarvisd service install
          # As a plain user: the 0640 env file is unreadable, so the default ports apply.
          jarvisd service status --wait 90s
          curl -fsS http://127.0.0.1:7700/health
          pid=$(systemctl show -p MainPID --value jarvisd)
          test "$(ps -o user= -p "$pid")" = jarvisd
          test "$(systemctl show -p Type --value jarvisd)" = notify
          test "$(sudo stat -c %a /var/lib/jarvisd)" = 700
          test "$(sudo stat -c %a /var/lib/jarvisd/jarvis.db)" = 600
          test "$(sudo stat -c %U:%G:%a /etc/jarvisd/jarvisd.env)" = root:jarvisd:640
          # The supervisor brings a killed jarvisd back.
          sudo kill -9 "$pid"
          sleep 2
          sudo jarvisd service status --wait 90s
          test "$(systemctl show -p MainPID --value jarvisd)" != "$pid"
          sudo jarvisd service restart
          sudo jarvisd service status --wait 90s
          sudo jarvisd service uninstall
          test ! -e /etc/systemd/system/jarvisd.service
          if systemctl is-active --quiet jarvisd; then exit 1; fi
          if curl -fsS http://127.0.0.1:7700/health; then exit 1; fi
          sudo test -d /var/lib/jarvisd          # data kept
      - name: Linux journal
        if: failure() && runner.os == 'Linux'
        run: sudo journalctl -u jarvisd --no-pager | tail -200

      - name: macOS LaunchDaemon
        if: runner.os == 'macOS'
        run: |
          set -x
          sudo mkdir -p /usr/local/bin
          sudo install -m 755 dist/jarvisd /usr/local/bin/jarvisd
          sudo jarvisd service install           # runs as $SUDO_USER, data in ~/.jarvisd
          jarvisd service status --wait 90s
          curl -fsS http://127.0.0.1:7700/health
          pid=$(pgrep -x jarvisd)
          test "$(ps -o user= -p "$pid" | tr -d ' ')" = "$(id -un)"
          test "$(stat -f %Lp ~/.jarvisd)" = 700
          test "$(stat -f %Lp ~/.jarvisd/jarvis.db)" = 600
          test -s ~/.jarvisd/logs/jarvisd.log
          sudo kill -9 "$pid"
          sleep 2
          jarvisd service status --wait 90s
          test "$(pgrep -x jarvisd)" != "$pid"
          sudo jarvisd service restart
          jarvisd service status --wait 90s
          sudo jarvisd service uninstall
          test ! -e /Library/LaunchDaemons/net.jarvisautomation.jarvisd.plist
          sleep 2
          if curl -fsS http://127.0.0.1:7700/health; then exit 1; fi
          test -d ~/.jarvisd                     # data kept
      - name: macOS log
        if: failure() && runner.os == 'macOS'
        run: tail -200 ~/.jarvisd/logs/jarvisd.log || true

      - name: Windows service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = Join-Path $env:ProgramFiles 'jarvisd'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist\jarvisd.exe $dir
          $exe = Join-Path $dir 'jarvisd.exe'
          & $exe service install
          & $exe service status --wait 120s
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7700/health | Select-Object -ExpandProperty Content
          $svc = Get-CimInstance Win32_Service -Filter "Name='jarvisd'"
          if ($svc.StartName -ne 'NT SERVICE\jarvisd') { throw "account: $($svc.StartName)" }
          if (-not $svc.DelayedAutoStart) { throw 'not delayed auto start' }
          if ($svc.PathName -notmatch '--home') { throw "no --home: $($svc.PathName)" }
          sc.exe qsidtype jarvisd
          sc.exe qfailure jarvisd
          sc.exe qfailureflag jarvisd
          icacls C:\ProgramData\jarvisd
          $p = Get-Process -Id $svc.ProcessId -IncludeUserName
          if ($p.UserName -ne 'NT SERVICE\jarvisd') { throw "runs as $($p.UserName)" }
          if (-not (Test-Path C:\ProgramData\jarvisd\jarvis.db)) { throw 'no DB under ProgramData' }
          if ((Get-Item C:\ProgramData\jarvisd\logs\jarvisd.log).Length -eq 0) { throw 'empty service log' }
          # A crash is restarted by the recovery actions (first after 5 s).
          Stop-Process -Id $svc.ProcessId -Force
          Start-Sleep 2
          & $exe service status --wait 90s
          $new = (Get-CimInstance Win32_Service -Filter "Name='jarvisd'").ProcessId
          if ($new -eq $svc.ProcessId) { throw 'not restarted' }
          # A clean stop ends the process (the SCM Stop cancels serve's context).
          & $exe service stop
          if (Get-Process -Id $new -ErrorAction SilentlyContinue) { throw 'still running after stop' }
          & $exe service restart
          & $exe service status --wait 120s
          & $exe service uninstall
          if (Get-Service jarvisd -ErrorAction SilentlyContinue) { throw 'service still registered' }
          if (-not (Test-Path C:\ProgramData\jarvisd\jarvis.db)) { throw 'data not kept' }
      - name: Windows log
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: Get-Content C:\ProgramData\jarvisd\logs\jarvisd.log -Tail 200

  # AD5/ID10: self-update end to end under the systemd system unit, from fake signed releases
  # (a throwaway minisign key trusted by test builds only): CLI upgrade, a broken release that
  # rolls back, the admin Update button through the unit's privileged ExecStartPre helper, the
  # restart button, and a manual rollback. See scripts/upgrade-e2e.sh.
  # ID11: on macOS and Windows the binary sits in a root/Administrator directory too, and the
  # admin button goes through the privileged helper (root LaunchDaemon, LocalSystem service):
  # swap, refusal of hostile staged files, crash-loop rollback. See scripts/upgrade-helper-e2e.sh.
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-amd64 }
          - { os: macos-14,       target: darwin-arm64 }
          - { os: windows-latest, target: windows-amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fetch native libs
        run: scripts/fetch-sherpa-libs.sh ${{ matrix.target }}
      - name: Install minisign
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: Upgrade end to end (system unit)
        if: runner.os == 'Linux'
        run: scripts/upgrade-e2e.sh system
      - name: Journal
        if: failure() && runner.os == 'Linux'
        run: sudo journalctl -u jarvisd --no-pager | tail -300
      - name: Upgrade end to end (privileged helper)
        if: runner.os != 'Linux'
        env:
          CGO_ENABLED: "0"
        run: scripts/upgrade-helper-e2e.sh
      - name: Logs
        if: failure() && runner.os == 'macOS'
        run: |
          sudo tail -100 /Library/Logs/jarvisd-updater.log || true
          tail -300 ~/.jarvisd/logs/jarvisd.log || true
      - name: Logs
        if: failure() && runner.os == 'Windows'
        run: |
          tail -100 "/c/Program Files/jarvisd/jarvisd-updater.log" || true
          tail -300 /c/ProgramData/jarvisd/logs/jarvisd.log || true

  # The install scripts (I3, I4) end to end against a release-shaped archive of this commit,
  # served from a local HTTP server (--base-url): verify, install, firewall fix, health,
  # idempotent re-run, uninstall (data kept), reinstall, uninstall --purge.
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-amd64,   ext: tar.gz }
          - { os: macos-14,       target: darwin-arm64,  ext: tar.gz }
          - { os: windows-latest, target: windows-amd64, ext: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      V0: v0.0.0-old-ci
      V: v0.0.0-ci
      V2: v0.0.1-ci
      V3: v0.0.2-ci
      BASE: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fetch native libs
        run: scripts/fetch-sherpa-libs.sh ${{ matrix.target }}
      # Two releases signed with a throwaway key that the test builds trust (-X …extraTrustedKey,
      # never in a real release): $V in dist/, $V2 in dist/next/ for the re-run that hands over
      # to `jarvisd upgrade`, and an unsigned $V3 in dist/unsigned/ that jarvisd must refuse.
      # The key is made and used by scripts/testsign, so no minisign lands on PATH (the scripts
      # require the project's signature when it is there).
      - name: Build release-shaped archives
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/test.key"
          pub=$(go run ./scripts/testsign keygen "$key")
          exe=jarvisd; [ "$RUNNER_OS" = Windows ] && exe=jarvisd.exe
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          release() { # tag dir [source tree]
            local name="jarvisd-$1-${{ matrix.target }}"
            mkdir -p "stage/$name" "$2"
            go build -C "${3:-.}" -trimpath -o "$PWD/stage/$name/$exe" \
              -ldflags "-X main.version=$1 -X github.com/alexberardi/jarvis-server/internal/update.extraTrustedKey=$pub" ./cmd/jarvisd
            if [ "${{ matrix.ext }}" = zip ]; then (cd stage && 7z a -tzip -bd "../$2/$name.zip" "$name" >/dev/null)
            else tar -C stage -czf "$2/$name.tar.gz" "$name"; fi
            (cd "$2" && sum "$name.${{ matrix.ext }}" > SHA256SUMS)
            go run ./scripts/testsign sign "$key" "$2/SHA256SUMS" "jarvisd $1 SHA256SUMS"
            cat "$2/SHA256SUMS"
          }
          release "$V" dist
          release "$V2" dist/next
          # $V0 in dist/old: v0.1.0-rc4's source, older than the privileged update helper (ID11):
          # no updater LaunchDaemon or Windows service, a unit whose ExecStartPre has no --owner.
          # Upgrading from it must end with the new version's service definition.
          git fetch --depth=1 origin tag v0.1.0-rc4
          git worktree add "$RUNNER_TEMP/old" v0.1.0-rc4
          cp -R internal/voice/sherpa/libs "$RUNNER_TEMP/old/internal/voice/sherpa/"
          release "$V0" dist/old "$RUNNER_TEMP/old"
          mkdir -p dist/unsigned
          echo "$(printf '0%.0s' $(seq 64))  jarvisd-$V3-${{ matrix.target }}.${{ matrix.ext }}" > dist/unsigned/SHA256SUMS
          cp scripts/install.sh scripts/install.ps1 dist/

      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh scripts/install.sh

      - name: Linux install.sh
        if: runner.os == 'Linux'
        run: |
          set -x
          (cd dist && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          # ufw on (default deny incoming) so the firewall fix has something to do.
          sudo ufw --force enable
          # A fake legacy stack shaped like prod's: Compose project "jarvis" in ~/.jarvis/compose
          # with a jarvis-* container holding 7700 and a llama-server that isn't named jarvis-*,
          # plus the legacy admin as a systemd user unit (linger on, as its installer does).
          # Next to it, containers that are not legacy and must keep running: a plain one and
          # one in another Compose project. Refused without --stop-legacy, stopped with it.
          mkdir -p ~/.jarvis/compose
          printf '%s\n' 'name: jarvis' 'services:' \
            '  jarvis-config-service:' '    container_name: jarvis-config-service' '    image: mirror.gcr.io/library/nginx:alpine' \
            '    restart: unless-stopped' '    ports: ["7700:80"]' \
            '  llama-server:' '    container_name: llama-server' '    image: mirror.gcr.io/library/nginx:alpine' '    restart: unless-stopped' \
            > ~/.jarvis/compose/docker-compose.yml
          docker compose -f ~/.jarvis/compose/docker-compose.yml up -d
          docker run -d --name plex --restart unless-stopped mirror.gcr.io/library/nginx:alpine
          docker run -d --name go2rtc --restart unless-stopped --label com.docker.compose.project=cameras \
            --label com.docker.compose.project.working_dir=/srv/cameras mirror.gcr.io/library/nginx:alpine
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          for _ in $(seq 40); do [ -S "$XDG_RUNTIME_DIR/systemd/private" ] && break; sleep 0.5; done
          mkdir -p ~/.config/systemd/user
          printf '%s\n' '[Service]' 'ExecStart=/bin/sleep infinity' '[Install]' 'WantedBy=default.target' \
            > ~/.config/systemd/user/jarvis-admin.service
          systemctl --user daemon-reload
          systemctl --user enable --now jarvis-admin.service
          if sh scripts/install.sh --base-url "$BASE" --yes; then exit 1; fi
          sh scripts/install.sh --base-url "$BASE" --yes --stop-legacy | tee legacy.log
          grep -q 'Stopping the legacy stack: .*jarvis-config-service' legacy.log
          grep -q 'Stopping the legacy stack: .*llama-server' legacy.log
          for c in jarvis-config-service llama-server; do
            test "$(docker inspect -f '{{.State.Running}} {{.HostConfig.RestartPolicy.Name}}' $c)" = "false no"
          done
          for c in plex go2rtc; do
            test "$(docker inspect -f '{{.State.Running}} {{.HostConfig.RestartPolicy.Name}}' $c)" = "true unless-stopped"
          done
          test "$(systemctl --user is-active jarvis-admin.service || true)" = inactive
          test "$(systemctl --user is-enabled jarvis-admin.service || true)" = disabled
          docker inspect jarvis-config-service llama-server >/dev/null # stopped, never removed
          test "$(jarvisd version)" = "$V"
          curl -fsS http://127.0.0.1:7700/health
          curl -fsSI http://127.0.0.1:7700/health | grep -i '^server: jarvisd'
          sudo ufw status | grep -q '# jarvisd'
          sudo jarvisd doctor
          sudo jarvisd setup-link | grep -q '/setup#token='
          # Re-running the same version is a no-op.
          sh scripts/install.sh --base-url "$BASE" --yes | tee rerun.log
          grep -q 'already installed' rerun.log
          # ...and it fetches nothing but SHA256SUMS (A10 F21): a base with only that file works.
          mkdir -p dist/sumsonly && cp dist/SHA256SUMS dist/sumsonly/
          sh scripts/install.sh --base-url "$BASE/sumsonly" --yes | grep -q 'already installed'
          # Installed but stopped: the service comes back on the installed binary, no download.
          sudo jarvisd service stop
          sh scripts/install.sh --base-url "$BASE/sumsonly" --yes | tee restart.log
          grep -q 'nothing to download' restart.log
          curl -fsS http://127.0.0.1:7700/health
          # Uninstall: service, binary and firewall rules go; data and account stay.
          sh scripts/install.sh --uninstall
          test ! -e /usr/local/bin/jarvisd && test ! -e /etc/systemd/system/jarvisd.service
          if sudo ufw status | grep -q jarvisd; then exit 1; fi
          sudo test -f /var/lib/jarvisd/jarvis.db && id jarvisd
          # Reinstall over the kept data, as root through sudo: --stop-legacy reaches the
          # invoking user's admin unit through `systemctl --user -M $SUDO_USER@`.
          systemctl --user enable --now jarvis-admin.service
          sudo sh scripts/install.sh --base-url "$BASE" --yes --stop-legacy | tee legacy2.log
          grep -q "jarvis-admin.service of $(id -un)" legacy2.log
          test "$(systemctl --user is-active jarvis-admin.service || true)" = inactive
          test "$(systemctl --user is-enabled jarvis-admin.service || true)" = disabled
          docker inspect -f '{{.State.Running}}' plex | grep -q true
          # A re-run with a newer release hands over to `jarvisd upgrade` (system unit, run as
          # root through sudo): signature checked by the installed binary, snapshot, swap,
          # restart, health gate.
          sh scripts/install.sh --base-url "$BASE/next" --yes | tee up.log
          grep -q 'with `jarvisd upgrade`' up.log
          grep -q "jarvisd $V2 is up and healthy" up.log
          test "$(jarvisd version)" = "$V2"
          curl -fsS http://127.0.0.1:7710/health | python3 -c 'import json,sys,os; assert json.load(sys.stdin)["version"] == os.environ["V2"]'
          test "$(/usr/local/bin/jarvisd.prev version)" = "$V"
          sudo cat /var/lib/jarvisd/updates/last-upgrade.json | python3 -c 'import json,sys; assert json.load(sys.stdin)["outcome"] == "succeeded"'
          sudo sh -c 'ls /var/lib/jarvisd/backups/jarvis-v0.0.0_ci-*.db' # the version, file-name safe
          sh scripts/install.sh --base-url "$BASE/next" --yes | grep -q 'already installed'
          # An unsigned release: jarvisd refuses it, nothing changes.
          if sh scripts/install.sh --base-url "$BASE/unsigned" --yes 2>&1 | tee bad.log; then :; fi
          grep -q 'only installs signed releases' bad.log
          test "$(jarvisd version)" = "$V2"
          curl -fsS http://127.0.0.1:7710/health
          # Purge everything (jarvisd.prev included).
          sh scripts/install.sh --uninstall --purge --yes
          test ! -e /usr/local/bin/jarvisd.prev
          sudo test ! -e /var/lib/jarvisd && sudo test ! -e /etc/jarvisd
          if id jarvisd; then exit 1; fi
          # An upgrade from rc4, whose unit's ExecStartPre has no --owner, ends with the unit this
          # version writes: install.sh runs rc4's `jarvisd upgrade`, then the new binary's
          # `service install` because its `service status` says the definition is stale.
          sh scripts/install.sh --base-url "$BASE/old" --yes
          test "$(jarvisd version)" = "$V0"
          if grep -q -- '--owner' /etc/systemd/system/jarvisd.service; then exit 1; fi
          stage/jarvisd-$V-${{ matrix.target }}/jarvisd service status --json | tee old.json || true
          grep -q '"definition_stale": true' old.json
          stage/jarvisd-$V-${{ matrix.target }}/jarvisd service status | grep -q '^definition: outdated'
          sh scripts/install.sh --base-url "$BASE/next" --yes | tee up-old.log
          grep -q "jarvisd $V2 is up and healthy" up-old.log
          grep -q 'Updating the jarvisd service definition' up-old.log
          test "$(jarvisd version)" = "$V2"
          grep -q -- 'upgrade --prestart --home /var/lib/jarvisd --owner jarvisd' /etc/systemd/system/jarvisd.service
          jarvisd service status --json | tee new.json
          grep -q '"definition_stale": false' new.json
          grep -q '"upgrade_helper": "root ExecStartPre' new.json
          curl -fsS http://127.0.0.1:7710/health | python3 -c 'import json,sys,os; assert json.load(sys.stdin)["version"] == os.environ["V2"]'
          sh scripts/install.sh --uninstall --purge --yes
          sudo ufw --force disable
          # With minisign installed a fresh install requires the project's signature: this
          # release is signed by the throwaway key, so the script refuses it.
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          if sh scripts/install.sh --base-url "$BASE" --yes 2>&1 | tee sig.log; then :; fi
          grep -q 'signature is INVALID' sig.log
          test ! -e /usr/local/bin/jarvisd
      - name: Linux journal
        if: failure() && runner.os == 'Linux'
        run: sudo journalctl -u jarvisd --no-pager | tail -200

      - name: macOS install.sh
        if: runner.os == 'macOS'
        run: |
          set -x
          fw=/usr/libexec/ApplicationFirewall/socketfilterfw
          (cd dist && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          sudo $fw --setglobalstate on
          # A fake legacy native service shaped like the Mac dev box: the LaunchAgent
          # com.jarvis.llm-proxy (what deploy-launchd.sh installs) listening on 7704, next to an
          # agent that is not the server's (com.jarvis.osx-api on 7723) and must keep running.
          # Refused without --stop-legacy; with it, under sudo as the box's owner ran it, the
          # legacy agent is booted out and disabled, and the restore commands are printed.
          uid=$(id -u) py=$(command -v python3)
          mkdir -p ~/Library/LaunchAgents
          agent() { # agent LABEL PORT
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' "<key>Label</key><string>$1</string>" \
              "<key>ProgramArguments</key><array><string>$py</string><string>-m</string><string>http.server</string><string>$2</string></array>" \
              '<key>WorkingDirectory</key><string>/tmp</string><key>RunAtLoad</key><true/><key>KeepAlive</key><true/>' \
              '</dict></plist>' > ~/Library/LaunchAgents/$1.plist
            launchctl bootstrap gui/$uid ~/Library/LaunchAgents/$1.plist
            for _ in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:$2/ && return 0; sleep 1; done
            return 1
          }
          agent com.jarvis.llm-proxy 7704
          agent com.jarvis.osx-api 7723
          # Docker Desktop's CLI is /usr/local/bin/docker, which sudo's secure_path leaves out; the
          # runner has no Docker, so a fake one there reports a legacy container until stopped.
          printf '%s\n' '#!/bin/sh' 'echo "$*" >> /tmp/fakedocker.log' 'case $1 in' \
            'ps) [ -e /tmp/fakedocker.stopped ] && exit 0' \
            '  case $* in *"{{.ID}}"*) echo "abcdefabcdef;jarvis-config-service;;jarvis;/x/.jarvis/compose" ;;' \
            '  *) echo "jarvis-config-service;jarvis;/x/.jarvis/compose" ;; esac ;;' \
            'stop) touch /tmp/fakedocker.stopped ;;' 'esac' > fakedocker
          test ! -e /usr/local/bin/docker
          sudo install -m 755 fakedocker /usr/local/bin/docker
          touch /tmp/fakedocker.log && chmod 666 /tmp/fakedocker.log
          # sudo's secure_path, which the script must widen to find docker (and minisign).
          minpath=/usr/bin:/bin:/usr/sbin:/sbin
          # The doctor names the agent and the fix.
          if stage/jarvisd-$V-${{ matrix.target }}/jarvisd doctor > doc.log 2>&1; then cat doc.log; exit 1; fi
          cat doc.log
          grep -q 'LaunchAgents of .*com.jarvis.llm-proxy (pid [0-9]' doc.log
          grep -q "launchctl bootout gui/$uid/com.jarvis.llm-proxy" doc.log
          if grep -q osx-api doc.log; then exit 1; fi
          if env PATH=$minpath sh scripts/install.sh --base-url "$BASE" --yes > refuse.log 2>&1; then cat refuse.log; exit 1; fi
          cat refuse.log
          grep -q 'Docker containers: jarvis-config-service' refuse.log
          grep -q 'LaunchAgents: com.jarvis.llm-proxy' refuse.log
          sudo env PATH=$minpath sh scripts/install.sh --base-url "$BASE" --yes --stop-legacy | tee legacy.log
          grep -q 'Stopping the legacy stack: jarvis-config-service' legacy.log
          grep -qx 'update --restart=no jarvis-config-service' /tmp/fakedocker.log
          grep -qx 'stop jarvis-config-service' /tmp/fakedocker.log
          sudo rm /usr/local/bin/docker
          grep -q "LaunchAgents of $(id -un)) and turning them off at login: com.jarvis.llm-proxy" legacy.log
          grep -qF "launchctl enable gui/$uid/com.jarvis.llm-proxy && launchctl bootstrap gui/$uid $HOME/Library/LaunchAgents/com.jarvis.llm-proxy.plist" legacy.log
          if launchctl print gui/$uid/com.jarvis.llm-proxy; then exit 1; fi
          launchctl print-disabled gui/$uid | grep -E '"com.jarvis.llm-proxy" => (disabled|true)'
          launchctl print gui/$uid/com.jarvis.osx-api | grep -q 'state = running'
          curl -fsS -o /dev/null http://127.0.0.1:7723/
          test "$(jarvisd version)" = "$V"
          curl -fsS http://127.0.0.1:7700/health
          $fw --getappblocked /usr/local/bin/jarvisd | grep -q permitted
          # macOS may admit a new program by itself; take it out so doctor --fix has work.
          sudo $fw --remove /usr/local/bin/jarvisd
          if sudo jarvisd doctor; then exit 1; fi
          sudo jarvisd doctor --fix
          $fw --getappblocked /usr/local/bin/jarvisd | grep -q permitted
          test "$(stat -f %Lp ~/.jarvisd)" = 700
          sudo jarvisd setup-link | grep -q '/setup#token='
          sh scripts/install.sh --base-url "$BASE" --yes | tee rerun.log
          grep -q 'already installed' rerun.log
          sh scripts/install.sh --uninstall
          test ! -e /usr/local/bin/jarvisd && test ! -e /Library/LaunchDaemons/net.jarvisautomation.jarvisd.plist
          if $fw --listapps | grep -q /usr/local/bin/jarvisd; then exit 1; fi
          test -f ~/.jarvisd/jarvis.db
          sh scripts/install.sh --base-url "$BASE" --yes
          $fw --getappblocked /usr/local/bin/jarvisd | grep -q permitted
          # A re-run with a newer release hands over to `sudo jarvisd upgrade`; the new build has
          # another ad-hoc signature, and the upgrade re-admits it to the firewall.
          sh scripts/install.sh --base-url "$BASE/next" --yes | tee up.log
          grep -q "jarvisd $V2 is up and healthy" up.log
          test "$(jarvisd version)" = "$V2"
          test "$(/usr/local/bin/jarvisd.prev version)" = "$V"
          curl -fsS http://127.0.0.1:7710/health | python3 -c 'import json,sys,os; assert json.load(sys.stdin)["version"] == os.environ["V2"]'
          python3 -c 'import json,os; assert json.load(open(os.path.expanduser("~/.jarvisd/updates/last-upgrade.json")))["outcome"] == "succeeded"'
          $fw --getappblocked /usr/local/bin/jarvisd | grep -q permitted
          sudo jarvisd doctor
          # The unsigned release is refused.
          if sh scripts/install.sh --base-url "$BASE/unsigned" --yes 2>&1 | tee bad.log; then :; fi
          grep -q 'only installs signed releases' bad.log
          test "$(jarvisd version)" = "$V2"
          sh scripts/install.sh --uninstall --purge --yes
          test ! -e ~/.jarvisd && test ! -e /usr/local/bin/jarvisd.prev
          # An upgrade from rc4, which had no updater LaunchDaemon (the rc4 -> rc6 Mac: `service
          # status` said "updater: none"), ends with it installed and loaded: install.sh runs
          # rc4's `jarvisd upgrade`, then the new binary's `service install` because its `service
          # status` says the definition is stale.
          helper=/Library/LaunchDaemons/net.jarvisautomation.jarvisd-updater.plist
          sh scripts/install.sh --base-url "$BASE/old" --yes
          test "$(jarvisd version)" = "$V0"
          test ! -e $helper
          stage/jarvisd-$V-${{ matrix.target }}/jarvisd service status --json | tee old.json || true
          grep -q '"definition_stale": true' old.json
          grep -q 'jarvisd-updater is not installed' old.json
          sh scripts/install.sh --base-url "$BASE/next" --yes | tee up-old.log
          grep -q "jarvisd $V2 is up and healthy" up-old.log
          grep -q 'Updating the jarvisd service definition' up-old.log
          test "$(jarvisd version)" = "$V2"
          test -f $helper
          grep -q "<string>$(id -un)</string>" $helper # the account jarvisd runs as, kept
          sudo launchctl print system/net.jarvisautomation.jarvisd-updater >/dev/null
          jarvisd service status | tee st.log
          grep -q 'updater: *net.jarvisautomation.jarvisd-updater (loaded' st.log
          if grep -q '^definition:' st.log; then exit 1; fi
          jarvisd service status --json | grep -q '"definition_stale": false'
          curl -fsS http://127.0.0.1:7710/health | python3 -c 'import json,sys,os; assert json.load(sys.stdin)["version"] == os.environ["V2"]'
          test "$(stat -f %Su ~/.jarvisd)" = "$(id -un)"
          sh scripts/install.sh --uninstall --purge --yes
          test ! -e $helper && test ! -e ~/.jarvisd
          sudo $fw --setglobalstate off
          # Something else on a jarvisd port: refused, naming it.
          (cd /tmp && exec "$py" -m http.server 7700 >/dev/null 2>&1) & other=$!
          for _ in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:7700/ && break; sleep 1; done
          if sudo env PATH=$minpath sh scripts/install.sh --base-url "$BASE" --yes > other.log 2>&1; then cat other.log; exit 1; fi
          cat other.log
          grep -q 'another program holds' other.log
          grep -Eiq 'python.* on 7700' other.log
          kill $other
          # Homebrew's minisign under sudo, whose PATH (secure_path) leaves /opt/homebrew/bin out:
          # the script still finds it, so this throwaway-signed release is refused.
          HOMEBREW_NO_AUTO_UPDATE=1 brew install minisign
          if sudo env PATH=$minpath sh scripts/install.sh --base-url "$BASE" --yes 2>&1 | tee sig.log; then :; fi
          grep -q 'signature is INVALID (/opt/homebrew/bin/minisign)' sig.log
          test ! -e /usr/local/bin/jarvisd
      - name: macOS log
        if: failure() && runner.os == 'macOS'
        run: tail -200 ~/.jarvisd/logs/jarvisd.log || true

      # Windows PowerShell 5.1 (powershell.exe, not pwsh), as `irm | iex` runs it.
      - name: Windows install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable.PSVersion
          Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'dist' -WindowStyle Hidden
          Start-Sleep 2
          netsh advfirewall set allprofiles state on
          function Install([string[]]$more) {
            & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -BaseUrl $env:BASE @more
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 $more failed ($LASTEXITCODE)" }
          }
          $exe = Join-Path $env:ProgramFiles 'jarvisd\jarvisd.exe'
          Install @('-Yes', '-StopLegacy') # no legacy stack here: a no-op
          if ((& $exe version) -ne $env:V) { throw 'wrong version' }
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7700/health | Select-Object -ExpandProperty Content
          netsh advfirewall firewall show rule name=jarvisd verbose
          if ($LASTEXITCODE -ne 0) { throw 'no jarvisd firewall rule' }
          if ([Environment]::GetEnvironmentVariable('Path', 'Machine') -notmatch [regex]::Escape((Split-Path $exe))) { throw 'not on the machine PATH' }
          if (-not ((& $exe setup-link) -match '/setup#token=')) { throw 'no setup link' }
          $rerun = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -BaseUrl $env:BASE -Yes | Out-String
          if ($rerun -notmatch 'already installed') { throw "re-run was not a no-op: $rerun" }
          Install @('-Uninstall')
          if (Get-Service jarvisd -ErrorAction SilentlyContinue) { throw 'service still registered' }
          if (Test-Path $exe) { throw 'binary not removed' }
          netsh advfirewall firewall show rule name=jarvisd | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'firewall rule not removed' }
          if (-not (Test-Path C:\ProgramData\jarvisd\jarvis.db)) { throw 'data not kept' }
          Install @('-Yes')
          # A re-run with a newer release hands over to `jarvisd upgrade` (SCM restart, health gate).
          $up = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -BaseUrl "$env:BASE/next" -Yes | Out-String
          if ($LASTEXITCODE -ne 0) { throw "upgrade re-run failed: $up" }
          Write-Host $up
          if ($up -notmatch "jarvisd $env:V2 is up and healthy") { throw 'no healthy upgrade reported' }
          if ((& $exe version) -ne $env:V2) { throw 'not upgraded' }
          if ((& (Join-Path $env:ProgramFiles 'jarvisd\jarvisd.prev.exe') version) -ne $env:V) { throw 'jarvisd.prev.exe is not the old version' }
          $h = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7710/health | Select-Object -ExpandProperty Content | ConvertFrom-Json
          if ($h.version -ne $env:V2) { throw "running $($h.version)" }
          $last = Get-Content C:\ProgramData\jarvisd\updates\last-upgrade.json -Raw | ConvertFrom-Json
          if ($last.outcome -ne 'succeeded') { throw "outcome $($last.outcome)" }
          # The unsigned release is refused.
          $ErrorActionPreference = 'Continue' # 5.1 turns redirected native stderr into errors
          $bad = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -BaseUrl "$env:BASE/unsigned" -Yes 2>&1 | Out-String
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -eq 0 -or $bad -notmatch 'only installs signed releases') { throw "unsigned release not refused: $bad" }
          if ((& $exe version) -ne $env:V2) { throw 'the refused upgrade changed the binary' }
          Install @('-Uninstall', '-Purge', '-Yes')
          if (Test-Path C:\ProgramData\jarvisd) { throw 'data not purged' }
          # An upgrade from rc4, which had no jarvisd-updater service, ends with it registered:
          # install.ps1 runs rc4's `jarvisd upgrade`, then the new binary's `service install`
          # because its `service status` says the definition is stale.
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -BaseUrl "$env:BASE/old" -Yes
          if ($LASTEXITCODE -ne 0) { throw "rc4 install failed ($LASTEXITCODE)" }
          if ((& $exe version) -ne $env:V0) { throw 'not the old version' }
          if (Get-Service jarvisd-updater -ErrorAction SilentlyContinue) { throw 'rc4 registered an updater?' }
          $cur = Join-Path $PWD "stage\jarvisd-$env:V-windows-amd64\jarvisd.exe"
          $old = (& $cur service status --json | Out-String | ConvertFrom-Json)
          Write-Host ($old | ConvertTo-Json)
          if (-not $old.definition_stale) { throw 'the rc4 definition is not reported stale' }
          $up = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -BaseUrl "$env:BASE/next" -Yes | Out-String
          if ($LASTEXITCODE -ne 0) { throw "upgrade from rc4 failed: $up" }
          Write-Host $up
          if ($up -notmatch "jarvisd $env:V2 is up and healthy") { throw 'no healthy upgrade reported' }
          if ($up -notmatch 'Updating the jarvisd service definition') { throw 'the definition was not updated' }
          if ((& $exe version) -ne $env:V2) { throw 'not upgraded from rc4' }
          if (-not (Get-Service jarvisd-updater -ErrorAction SilentlyContinue)) { throw 'no jarvisd-updater after the upgrade' }
          $new = (& $exe service status --json | Out-String | ConvertFrom-Json)
          Write-Host ($new | ConvertTo-Json)
          if ($new.definition_stale -or $new.upgrade_helper -notmatch 'jarvisd-updater') { throw 'the definition is still stale' }
          $h = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7710/health | Select-Object -ExpandProperty Content | ConvertFrom-Json
          if ($h.version -ne $env:V2) { throw "running $($h.version)" }
          Install @('-Uninstall', '-Purge', '-Yes')
          if (Get-Service jarvisd-updater -ErrorAction SilentlyContinue) { throw 'updater not removed' }
          $global:LASTEXITCODE = 0
      - name: Windows log
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: Get-Content C:\ProgramData\jarvisd\logs\jarvisd.log -Tail 200

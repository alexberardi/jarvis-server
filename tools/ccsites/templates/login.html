{{define "content"}}<h1>Sign in to {{.D.SiteName}}</h1>
<p>You need to sign in to continue.</p>
{{with .D.Error}}<p class="error" role="alert">{{.}}</p>{{end}}
<form method="post" action="/{{.D.Site}}/login">
<input type="hidden" name="next" value="{{.D.Next}}">
<label for="email">Email</label><input type="email" id="email" name="email" value="{{.D.Email}}" autocomplete="username">
<label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password">
<div class="actions"><button class="btn" type="submit">Sign in</button></div>
</form>{{end}}

; The L1 lane's PJSIP, written the way FreePBX 17 generates it (core PJSip.class.php,
; release/17.0): one transport, then each extension as endpoint + aor + auth with every field
; spelled out (FreePBX writes no templates). The fields jarvisd has to cope with are marked
; "FreePBX:" with the extension setting they come from (docs/cc/phone-sip.md §3);
; tools/pipeline's TestSIPLaneCopiesFreePBXDefaults checks them. scripts/sip-lane renders the
; @…@ placeholders (ports offset per sandbox). Passwords are this lane's own, test-only.

[global]
type=global
user_agent=FPBX-17.0(22.11.0)       ; what FreePBX 17 on Asterisk 22 announces
endpoint_identifier_order=username,ip,anonymous

#include /var/lib/asterisk/lane/pjsip_ban.conf   ; lane-firewall's ACL (Responsive Firewall stand-in)

[0.0.0.0-udp]
type=transport
protocol=udp
bind=127.0.0.1:@SIP_PORT@                 ; loopback only: the lane is never on the LAN
allow_reload=yes

; ---- 100: the Jarvis extension (jarvisd registers here; a baresip stand-in until it can) ----
[100]
type=endpoint
aors=100
auth=100-auth
context=from-internal
callerid=Jarvis <100>
allow=ulaw,alaw,gsm,g726,g722             ; FreePBX: Disallowed/Allowed codecs default
dtmf_mode=rfc4733                         ; FreePBX: DTMF Signaling = RFC 4733
direct_media=yes                          ; FreePBX: Direct Media = yes (re-INVITEs RTP away)
timers=yes                                ; FreePBX: Session Timers = yes (RFC 4028 refreshes)
timers_min_se=90
timers_sess_expires=1800
rtp_timeout=30                            ; FreePBX: RTP Timeout 30 (hang up after 30 s of no RTP)
rtp_timeout_hold=300
send_pai=yes                              ; FreePBX: Send RPID = Send P-Asserted-Identity (sendrpid=pai)
send_rpid=no
trust_id_inbound=yes
trust_id_outbound=yes
send_connected_line=yes
rtp_symmetric=yes                         ; FreePBX: NAT = yes (force_rport, comedia)
force_rport=yes
rewrite_contact=yes
ice_support=no
use_avpf=no
media_encryption=no
max_audio_streams=1
device_state_busy_at=0
refer_blind_progress=yes
language=en
tos_audio=ef
cos_audio=5

[100]
type=aor
max_contacts=1                            ; FreePBX: Max Contacts = 1
remove_existing=no                        ; FreePBX: Remove Existing = no (a new contact is refused)
qualify_frequency=60                      ; FreePBX: Qualify Frequency = 60 (OPTIONS every minute)
qualify_timeout=3.0
minimum_expiration=60
default_expiration=3600
maximum_expiration=7200

[100-auth]
type=auth
auth_type=userpass
username=100
password=lane-jarvis-100

; ---- 101: Alice, a person's desk phone (baresip) ----
[101]
type=endpoint
aors=101
auth=101-auth
context=from-internal
callerid=Alice <101>
allow=ulaw,alaw,gsm,g726,g722             ; FreePBX: Disallowed/Allowed codecs default
dtmf_mode=rfc4733                         ; FreePBX: DTMF Signaling = RFC 4733
direct_media=yes                          ; FreePBX: Direct Media = yes (re-INVITEs RTP away)
timers=yes                                ; FreePBX: Session Timers = yes (RFC 4028 refreshes)
timers_min_se=90
timers_sess_expires=1800
rtp_timeout=30                            ; FreePBX: RTP Timeout 30 (hang up after 30 s of no RTP)
rtp_timeout_hold=300
send_pai=yes                              ; FreePBX: Send RPID = Send P-Asserted-Identity (sendrpid=pai)
send_rpid=no
trust_id_inbound=yes
trust_id_outbound=yes
send_connected_line=yes
rtp_symmetric=yes                         ; FreePBX: NAT = yes (force_rport, comedia)
force_rport=yes
rewrite_contact=yes
ice_support=no
use_avpf=no
media_encryption=no
max_audio_streams=1
device_state_busy_at=0
refer_blind_progress=yes
language=en
tos_audio=ef
cos_audio=5

[101]
type=aor
max_contacts=1                            ; FreePBX: Max Contacts = 1
remove_existing=no                        ; FreePBX: Remove Existing = no (a new contact is refused)
qualify_frequency=60                      ; FreePBX: Qualify Frequency = 60 (OPTIONS every minute)
qualify_timeout=3.0
minimum_expiration=60
default_expiration=3600
maximum_expiration=7200

[101-auth]
type=auth
auth_type=userpass
username=101
password=lane-alice-101

; ---- carrier: the fake carrier's trunk (baresip; FreePBX "Authentication: Inbound") ----
; Calls to it go to its fixed address; calls from it authenticate as user "carrier" and land in
; from-pstn (FreePBX's from-trunk), where the inbound routes are.
[carrier]
type=endpoint
aors=carrier
auth=carrier-auth
context=from-pstn
allow=ulaw,alaw
dtmf_mode=rfc4733
direct_media=no                           ; FreePBX trunks: Direct Media = no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
send_pai=yes
trust_id_inbound=yes
language=en

[carrier]
type=aor
contact=sip:carrier@127.0.0.1:@CARRIER_PORT@
qualify_frequency=0

[carrier-auth]
type=auth
auth_type=userpass
username=carrier
password=lane-carrier

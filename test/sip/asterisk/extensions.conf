; The L1 lane's dialplan: the FreePBX 17 behaviours jarvisd meets, with the applications
; FreePBX's generated dialplan runs for them (extensions_additional.conf: app-echo-test,
; app-speakextennum, macro-exten-vm, ext-group, macro-dialout-trunk/macro-outisbusy, ext-did).
; What a carrier would do (busy, no answer, all trunks busy) is played here by fixed numbers,
; since the fake carrier cannot vary per number. docs/cc/phone-sip.md §3, §5.
;
;   *43              echo test: prompt, Echo(), prompt                    (200, audio back)
;   *65              says your extension number                          (200, "...is one zero one")
;   100, 101         extensions; busy (call waiting off, in use) -> 486, call waiting on by default
;   600              ring group 101 & 100, ring all, 20 s
;   2125550486       outbound, the trunk says busy                       -> 486 Busy Here
;   2125550480       outbound, no answer                                 -> 183 + announcement + 503
;   2125550200       outbound, all trunks busy                           -> 200 + "all circuits are busy"
;   other NXXNXXXXXX / 1NXXNXXXXXX   outbound route to the fake carrier's trunk
;   inbound DID 5551230000 -> 100 (Jarvis); 5551230600 -> ring group 600

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
RINGTIMER=15                 ; FreePBX: Ringtime default 15 s
DIAL_OPTIONS=HhTtr           ; FreePBX: Asterisk Dial command options
TRUNK_OPTIONS=T              ; FreePBX: Asterisk Outbound Dial command options

[from-internal]
include => app-echo-test
include => app-speakextennum
include => ext-local
include => ext-group
include => lane-carrier-says
include => outbound-allroutes
exten => h,1,Hangup()

[app-echo-test]
exten => *43,1,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

[app-speakextennum]
exten => *65,1,Answer()
 same => n,Wait(1)
 same => n,Playback(your&extension&number&is)
 same => n,SayDigits(${CALLERID(num)})
 same => n,Wait(2)
 same => n,Hangup()

[ext-local]
exten => _10X,1,Gosub(lane-exten,s,1(${EXTEN}))
 same => n,Hangup()

; macro-exten-vm without voicemail: call waiting is ASTDB CW/<ext>, ENABLED for a new
; extension; an extension in use with call waiting off is busy (Busy() answers 486).
[lane-exten]
exten => s,1,Set(CW=${IF(${DB_EXISTS(CW/${ARG1})}?${DB_RESULT}:ENABLED)})
 same => n,GotoIf($["${CW}" != "ENABLED" & "${DEVICE_STATE(PJSIP/${ARG1})}" = "INUSE"]?busy)
 same => n,Dial(PJSIP/${ARG1},${RINGTIMER},${DIAL_OPTIONS})
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,Return()
 same => n(busy),Busy(20)
 same => n,Return()

[ext-group]
exten => 600,1,Set(RingGroupMethod=ringall)
 same => n,Dial(PJSIP/101&PJSIP/100,20,${DIAL_OPTIONS})
 same => n,Hangup()

[outbound-allroutes]
exten => _NXXNXXXXXX,1,Goto(lane-dialout,${EXTEN},1)
exten => _1NXXNXXXXXX,1,Goto(lane-dialout,${EXTEN},1)
; no route matches: FreePBX's "cannot be completed as dialed" is 183 + announcement + 503
exten => _X.,1,Progress()
 same => n,Playback(ss-noservice,noanswer)
 same => n,Congestion(20)

; What the carrier answers for these numbers, as FreePBX passes it on (included before
; outbound-allroutes, whose patterns would match them too).
[lane-carrier-says]
exten => 2125550486,1,Busy(20)
exten => 2125550480,1,Ringing()
 same => n,Wait(2)
 same => n,Progress()
 same => n,Playback(number-not-answering,noanswer)
 same => n,Congestion(20)
exten => 2125550200,1,Answer()
 same => n,Wait(1)
 same => n,Playback(all-circuits-busy-now&please-try-call-later)
 same => n,Hangup()

[lane-dialout]
exten => _X.,1,Dial(PJSIP/${EXTEN}@carrier,300,${TRUNK_OPTIONS})
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,Progress()
 same => n,Playback(all-circuits-busy-now&please-try-call-later,noanswer)
 same => n,Congestion(20)
 same => n(busy),Busy(20)

[from-pstn]
exten => 5551230000,1,Goto(ext-local,100,1)
exten => 5551230600,1,Goto(ext-group,600,1)
exten => _X.,1,Answer()
 same => n,Playback(ss-noservice)
 same => n,Hangup()
exten => h,1,Hangup()
